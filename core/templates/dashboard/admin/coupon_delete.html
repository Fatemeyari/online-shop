{% extends "base.html" %}
{% load static %}

{% block extra_css %}

{{ block.super }}

<link rel="stylesheet"
      href="{% static 'css/dashboard/admin/product_delete.css' %}">

{% endblock %}

{% block content %}

<section class="delete-page">

    <div class="delete-container">

        <div class="delete-card">

            <div class="delete-icon">

                <i class="fa-solid fa-triangle-exclamation"></i>

            </div>

            <h1>

                حذف کپن

            </h1>

            <p class="delete-text">

                آیا از حذف این کپن اطمینان دارید؟

            </p>

            <div class="warning-box">

                <i class="fa-solid fa-circle-info"></i>

                <span>

                    پس از حذف، امکان بازگردانی این کپن وجود ندارد.

                </span>

            </div>

            <form method="post">

                {% csrf_token %}
                    <div class="delete-actions">

                    <a href="{% url 'dashboard:admin:coupon-list' %}"
                       class="cancel-btn">

                        <i class="fa-solid fa-arrow-right"></i>

                        بازگشت

                    </a>

                    <button
                        type="submit"
                        class="delete-btn">

                        <i class="fa-solid fa-trash"></i>

                        حذف آدرس

                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
